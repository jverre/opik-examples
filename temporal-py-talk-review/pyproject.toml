[project]
name = "temporal-py-talk-review"
version = "0.1.0"
description = "Durable conference-talk review workflow on Temporal (Python) with OpenAI, traced to Opik over OpenTelemetry across two OS processes"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "openai>=1.60",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
    "opentelemetry-sdk>=1.27",
    "opik==2.2.96",
    "python-dotenv>=1.0",
    "temporalio[opentelemetry]>=1.8",
]

[project.scripts]
talk-review = "talk_review.demo:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["talk_review"]
