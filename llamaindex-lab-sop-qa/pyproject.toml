[project]
name = "llamaindex-lab-sop-qa"
version = "0.1.0"
description = "LlamaIndex Q&A over generated laboratory SOP PDFs, traced with Opik and checked step by step with an Opik test suite"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "llama-index-core>=0.14.25",
    "llama-index-embeddings-openai>=0.7.0",
    "llama-index-llms-openai>=0.8.2",
    "llama-index-readers-file>=0.7.0",
    "llama-index-callbacks-opik>=1.4.0",
    "opik==2.2.96",
    "python-dotenv>=1.2.3",
    "reportlab>=5.0.1",
]

[project.scripts]
sop-qa = "sop_qa.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sop_qa"]
