[project]
name = "openai-vision-nutrition-labels"
version = "0.1.0"
description = "GPT-4o-mini vision reads fictional nutrition-label images into typed fields, with every label attached to its Opik trace and an Opik test suite that keeps the hard labels honest"
requires-python = ">=3.12,<3.14"
dependencies = [
    "openai>=1.60,<3",
    "opik==2.2.96",
    "pillow>=11.0",
    "pydantic>=2.8",
    "python-dotenv>=1.0.0",
]

[project.scripts]
nutrition-labels = "nutrition_labels.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nutrition_labels"]
