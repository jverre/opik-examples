[project]
name = "smolagents-solar-farm-analyst"
version = "0.1.0"
description = "A smolagents CodeAgent that audits a solar farm's inverter output CSV by writing pandas code, traced to Opik over OpenTelemetry"
requires-python = ">=3.12,<3.14"
dependencies = [
    "openai==3.29.0",
    "openinference-instrumentation-smolagents==0.1.43",
    "opentelemetry-exporter-otlp==1.45.1",
    "opentelemetry-sdk==1.45.1",
    "pandas==3.0.6",
    "python-dotenv==1.2.4",
    "smolagents==1.26.0",
]
