[project]
name = "prompt-library-podcast-titles"
version = "0.1.0"
description = "A podcast episode title prompt kept in the Opik prompt library: immutable versions, a diff, and a test suite that goes from 0% to 100% across them"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "openai>=1.0",
    "opik==2.2.96",
    "python-dotenv>=1.0",
]

[project.scripts]
podcast-titles = "podcast_titles.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["podcast_titles"]
