quarkus.application.name=quarkus-langchain4j-banking-faq
quarkus.http.port=${PORT:4261}

# Models: gpt-4o-mini answers; text-embedding-3-small embeds the FAQ chunks and each question.
quarkus.langchain4j.openai.api-key=${OPENAI_API_KEY}
quarkus.langchain4j.openai.chat-model.model-name=gpt-4o-mini
quarkus.langchain4j.openai.chat-model.temperature=0
quarkus.langchain4j.openai.timeout=60s
quarkus.langchain4j.openai.embedding-model.model-name=text-embedding-3-small

# RAG: easy-rag ingests every file under this path at startup and retrieves the top 3 chunks per question.
quarkus.langchain4j.easy-rag.path=faq
quarkus.langchain4j.easy-rag.path-type=CLASSPATH
quarkus.langchain4j.easy-rag.max-segment-size=400
quarkus.langchain4j.easy-rag.max-overlap-size=40
quarkus.langchain4j.easy-rag.max-results=3
quarkus.langchain4j.easy-rag.reuse-embeddings.enabled=false

# Opik over OTLP. Credentials come from the environment at run time.
quarkus.otel.enabled=true
quarkus.otel.traces.enabled=true
quarkus.otel.exporter.otlp.traces.endpoint=${OPIK_OTEL_ENDPOINT:https://www.comet.com/opik/api/v1/private/otel}
quarkus.otel.exporter.otlp.traces.protocol=http/protobuf
quarkus.otel.exporter.otlp.traces.headers=Authorization=${OPIK_API_KEY},Comet-Workspace=${OPIK_WORKSPACE},projectName=${OPIK_PROJECT_NAME:quarkus-langchain4j-banking-faq}
quarkus.otel.bsp.schedule.delay=1s

# Without these two, LLM spans carry model and token usage but no prompt or completion text.
quarkus.langchain4j.tracing.include-prompt=true
quarkus.langchain4j.tracing.include-completion=true
quarkus.langchain4j.tracing.include-tool-arguments=true
quarkus.langchain4j.tracing.include-tool-result=true
