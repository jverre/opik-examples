<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Spoke &amp; Sprocket Chat</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: #f3f1ec; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #222; padding: 16px; }
    .widget { width: 100%; max-width: 420px; height: 580px; max-height: 90vh; background: #fff; border-radius: 14px;
      box-shadow: 0 10px 40px rgba(0,0,0,.15); display: flex; flex-direction: column; overflow: hidden; }
    header { background: #1f6f5c; color: #fff; padding: 14px 18px; }
    header h1 { margin: 0; font-size: 16px; }
    header p { margin: 2px 0 0; font-size: 12px; opacity: .85; }
    #messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
    .msg { max-width: 80%; padding: 9px 13px; border-radius: 12px; font-size: 14px; line-height: 1.45; white-space: pre-wrap; }
    .bot { background: #eef2f0; align-self: flex-start; }
    .you { background: #1f6f5c; color: #fff; align-self: flex-end; }
    form { display: flex; gap: 8px; padding: 12px; border-top: 1px solid #e5e5e5; }
    input { flex: 1; padding: 10px 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 14px; }
    button { background: #1f6f5c; color: #fff; border: 0; border-radius: 8px; padding: 0 16px; font-size: 14px; cursor: pointer; }
    button:disabled { opacity: .5; cursor: default; }
  </style>
</head>
<body>
  <div class="widget">
    <header><h1>Spoke &amp; Sprocket Cycle Works</h1><p>Ask about repairs, prices and hours</p></header>
    <div id="messages"></div>
    <form id="form">
      <input id="input" placeholder="Type your question..." autocomplete="off" />
      <button id="send">Send</button>
    </form>
  </div>
  <script>
    // One sessionId per browser tab: the server turns it into an Opik thread id.
    const sessionId = "web-" + crypto.randomUUID().slice(0, 8);
    const messages = document.getElementById("messages");
    const input = document.getElementById("input");
    const send = document.getElementById("send");
    function add(text, who) {
      const div = document.createElement("div");
      div.className = "msg " + who;
      div.textContent = text;
      messages.appendChild(div);
      messages.scrollTop = messages.scrollHeight;
    }
    add("Hi! Ask me about repairs, prices or opening hours.", "bot");
    document.getElementById("form").addEventListener("submit", async (event) => {
      event.preventDefault();
      const message = input.value.trim();
      if (!message) return;
      input.value = "";
      add(message, "you");
      send.disabled = true;
      try {
        const res = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message, sessionId }),
        });
        const data = await res.json();
        add(res.ok ? data.reply : data.error || "Something went wrong.", "bot");
      } catch {
        add("Could not reach the shop. Try again.", "bot");
      }
      send.disabled = false;
      input.focus();
    });
  </script>
</body>
</html>
